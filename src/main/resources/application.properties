quarkus.devservices.enabled=false

# Every ${UPPER_CASE} value comes from the .env file (see .env.example), which is never
# committed. Anything secret or specific to one installation belongs there, not here.

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER}
quarkus.datasource.password=${POSTGRES_PASSWORD}

quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
quarkus.datasource.jdbc.max-size=16

quarkus.flyway.migrate-at-start=true

quarkus.jooq.dialect=POSTGRES

# Quarkus CORS. Credentials are allowed so the website can send the admin login cookie.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${ticket.frontend-url}
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.headers=accept, origin, content-type, x-requested-with, x-user-subject, x-user-email, x-user-first-name, x-user-last-name
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS

# Admin login: POST /admin/login with the form fields username and password answers
# 200 with an encrypted http-only cookie, or 401. The empty pages turn off redirects.
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.post-location=/admin/login
quarkus.http.auth.form.username-parameter=username
quarkus.http.auth.form.password-parameter=password
quarkus.http.auth.form.login-page=
quarkus.http.auth.form.landing-page=
quarkus.http.auth.form.error-page=
quarkus.http.auth.form.http-only-cookie=true
quarkus.http.auth.session.encryption-key=${SESSION_ENCRYPTION_KEY}
# The admin that is created on startup
ticket.admin.username=${ADMIN_USERNAME}
ticket.admin.password=${ADMIN_PASSWORD}

# Mail: in dev mode emails are only written to the log. In production the mail server
# is set in .env with QUARKUS_MAILER_HOST, _PORT, _USERNAME and _PASSWORD.
quarkus.mailer.from=${MAIL_FROM}

# Days a customer has to pay before the reserved tickets are released
ticket.payment-days=7
# The website; the QR codes link to {ticket.frontend-url}/tickets/{code}
ticket.frontend-url=http://localhost:3000
# The account shown in the payment email
ticket.bank.recipient=${BANK_RECIPIENT}
ticket.bank.iban=${BANK_IBAN}
