quarkus.devservices.enabled=false

# Every ${UPPER_CASE} value comes from the .env file (see .env.example), which is never
# committed. Anything secret or specific to one installation belongs there, not here.

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER}
quarkus.datasource.password=${POSTGRES_PASSWORD}

quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
quarkus.datasource.jdbc.max-size=16

quarkus.flyway.migrate-at-start=true

quarkus.jooq.dialect=POSTGRES

# Quarkus CORS. Credentials are allowed so the website can send the login cookies.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${ticket.frontend-url}
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.headers=accept, origin, content-type, x-requested-with
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS

# Admin login: POST /admin/login with the form fields username and password answers
# 200 with an encrypted http-only cookie, or 401. The empty pages turn off redirects.
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.post-location=/admin/login
quarkus.http.auth.form.username-parameter=username
quarkus.http.auth.form.password-parameter=password
quarkus.http.auth.form.login-page=
quarkus.http.auth.form.landing-page=
quarkus.http.auth.form.error-page=
quarkus.http.auth.form.http-only-cookie=true
quarkus.http.auth.session.encryption-key=${SESSION_ENCRYPTION_KEY}

# Customer login via IServ and Moodle (see README.md). backend-url: this backend as
# the browser sees it. The providers are set in .env as TICKET_SSO_ISERV_URL, _CLIENT_ID and
# _CLIENT_SECRET, and the same with MOODLE; a provider that is not set is not offered.
ticket.sso.backend-url=http://localhost:8080

# Mail: every email is sent as MAIL_FROM through the SMTP server of that address (see
# README.md, Emails). In dev mode, or with QUARKUS_MAILER_MOCK=true, emails are only written
# to the log, but the values still have to be set (placeholders are fine then).
# Port 587: MAIL_TLS=false and MAIL_START_TLS=REQUIRED (the defaults, so the password is
# never sent unencrypted). Port 465: MAIL_TLS=true and MAIL_START_TLS=DISABLED.
quarkus.mailer.from=${MAIL_FROM}
quarkus.mailer.host=${MAIL_HOST}
quarkus.mailer.port=${MAIL_PORT}
quarkus.mailer.username=${MAIL_USERNAME}
quarkus.mailer.password=${MAIL_PASSWORD}
quarkus.mailer.tls=${MAIL_TLS:false}
quarkus.mailer.start-tls=${MAIL_START_TLS:REQUIRED}
# Named in every customer email and used as its Reply-To
ticket.support-email=${SUPPORT_EMAIL}

# The website; the QR codes link to {ticket.frontend-url}/tickets/{code}
ticket.frontend-url=http://localhost:3000
# The account shown in the payment email
ticket.bank.recipient=${BANK_RECIPIENT}
ticket.bank.iban=${BANK_IBAN}
